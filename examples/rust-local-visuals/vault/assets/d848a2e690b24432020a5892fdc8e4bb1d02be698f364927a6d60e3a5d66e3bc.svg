<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img"><title>Trace conventional current around a closed ideal DC circuit</title><rect width="1000" height="200" fill="white"/><line x1="120.0000" y1="75.0000" x2="360.0000" y2="75.0000" stroke="#475569"/><polygon points="268.0000,75.0000 259.2242,79.7943 259.2242,70.2057" fill="#475569"/><text x="240.0000" y="63.0000" font-size="12" fill="#172033">Current I</text><line x1="360.0000" y1="75.0000" x2="600.0000" y2="75.0000" stroke="#475569"/><polygon points="508.0000,75.0000 499.2242,79.7943 499.2242,70.2057" fill="#475569"/><text x="480.0000" y="63.0000" font-size="12" fill="#172033">Same current I</text><line x1="600.0000" y1="75.0000" x2="120.0000" y2="75.0000" stroke="#475569"/><polygon points="212.0000,75.0000 220.7758,70.2057 220.7758,79.7943" fill="#475569"/><text x="360.0000" y="63.0000" font-size="12" fill="#172033">Source closes the loop</text><rect x="30" y="40" width="180" height="70" rx="7" fill="#eef3ff" stroke="#245ac6"/><text x="38.0000" y="58.0000" font-size="12" fill="#172033">Source positive terminal</text><rect x="270" y="40" width="180" height="70" rx="7" fill="#eef3ff" stroke="#245ac6"/><text x="278.0000" y="58.0000" font-size="12" fill="#172033">2 ohm resistor</text><rect x="510" y="40" width="180" height="70" rx="7" fill="#eef3ff" stroke="#245ac6"/><text x="518.0000" y="58.0000" font-size="12" fill="#172033">Return to source negative</text></svg>