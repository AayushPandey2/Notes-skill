<!doctype html><html><head><meta charset='utf-8'><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vrp0415CGIvobwMQlSlyp69z4ArwAphPpaPhkIQYnZA='; base-uri 'none'"><title>Step through the executed binary-search trace</title></head><body><h1>Step through the executed binary-search trace</h1><label>Step <input id='step' type='range' min='0' max='2' value='0'></label><h2 id='label'></h2><pre id='state'></pre><script>const frames=[{"label": "Step 1: raise low", "state": "{\n  \"values\": [\n    1,\n    4,\n    7,\n    10,\n    13,\n    16,\n    19\n  ],\n  \"target\": 13,\n  \"low\": 0,\n  \"high_exclusive\": 7,\n  \"midpoint\": 3,\n  \"candidate\": 10,\n  \"decision\": \"raise low\"\n}"}, {"label": "Step 2: lower high", "state": "{\n  \"values\": [\n    1,\n    4,\n    7,\n    10,\n    13,\n    16,\n    19\n  ],\n  \"target\": 13,\n  \"low\": 4,\n  \"high_exclusive\": 7,\n  \"midpoint\": 5,\n  \"candidate\": 16,\n  \"decision\": \"lower high\"\n}"}, {"label": "Step 3: found", "state": "{\n  \"values\": [\n    1,\n    4,\n    7,\n    10,\n    13,\n    16,\n    19\n  ],\n  \"target\": 13,\n  \"low\": 4,\n  \"high_exclusive\": 5,\n  \"midpoint\": 4,\n  \"candidate\": 13,\n  \"decision\": \"found\"\n}"}];const slider=document.getElementById('step');function show(){const f=frames[Number(slider.value)];document.getElementById('label').textContent=f.label;document.getElementById('state').textContent=f.state;}slider.addEventListener('input',show);show();</script></body></html>
