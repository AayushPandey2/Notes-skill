command_mappings:
  scribe-notes:
    master: null
    variant: null
    legacy_route: null
    mode: author
    universal: true
    description: Universal interactive note-creation command dynamically routing across M1-M7 and single-note vs. hierarchical multi-note collections.
  scribe-doubt:
    master: null
    variant: null
    legacy_route: null
    mode: existing-notes
    description: Read-only grounded Q&A strictly from existing Obsidian vault notes.
  scribe-quiz:
    master: M6
    variant: mock_exam
    legacy_route: practice
    mode: existing-notes
    description: Interactive one-question-at-a-time active-recall quiz over existing Obsidian vault notes.
  scribe-setfolder:
    master: null
    variant: null
    legacy_route: null
    mode: setfolder
    description: Configure the target Obsidian notes folder path in ~/.scriptorium-config.json.

command_aliases:
  scribe-ytnote:
    target_command: scribe-notes
    adapter: video
    default_master: M2
    default_variant: lecture_order
    description: Unified video & lecture note command (combining /scribe-ytnotes and /scribe-ytlecture) feeding transcript/frame ingestion into /scribe-notes.
  scribe-ytnotes:
    target_command: scribe-notes
    adapter: video
    default_master: M2
    default_variant: lecture_order
    description: Compatible alias for /scribe-ytnote feeding the shared video adapter and /scribe-notes pipeline.
  scribe-ytlecture:
    target_command: scribe-notes
    adapter: video
    default_master: M2
    default_variant: lecture_order
    description: Compatible alias for /scribe-ytnote feeding the shared video adapter and /scribe-notes pipeline.

retired_commands:
  scribe-deepnotes:
    replaced_by: scribe-notes
    equivalent_master: M1
    equivalent_variant: null
    migration_hint: "Command '/scribe-deepnotes' has been unified into '/scribe-notes'. Use '/scribe-notes <topic>' (select Deep Learning Notes)."
  scribe-distill:
    replaced_by: scribe-notes
    equivalent_master: M3
    equivalent_variant: null
    migration_hint: "Command '/scribe-distill' has been unified into '/scribe-notes'. Use '/scribe-notes cheat sheet for <topic>'."
  scribe-atomic-notes:
    replaced_by: scribe-notes
    equivalent_master: M3
    equivalent_variant: atomic_card
    migration_hint: "Command '/scribe-atomic-notes' has been unified into '/scribe-notes'. Use '/scribe-notes atomic note for <topic>'."
  scribe-compare:
    replaced_by: scribe-notes
    equivalent_master: M7
    equivalent_variant: comparison_guide
    migration_hint: "Command '/scribe-compare' has been unified into '/scribe-notes'. Use '/scribe-notes compare <A> vs <B>'."
  scribe-dsa:
    replaced_by: scribe-notes
    equivalent_master: M5
    equivalent_variant: null
    migration_hint: "Command '/scribe-dsa' has been unified into '/scribe-notes'. Use '/scribe-notes implement <problem> in <language>'."
  scribe-practice:
    replaced_by: scribe-notes
    equivalent_master: M6
    equivalent_variant: null
    migration_hint: "Command '/scribe-practice' has been unified into '/scribe-notes'. Use '/scribe-notes practice set for <topic>'."
  scribe-ingest:
    replaced_by: scribe-notes
    equivalent_master: M2
    equivalent_variant: lecture_order
    migration_hint: "Command '/scribe-ingest' has been unified into '/scribe-notes'. Use '/scribe-notes <source URL or material>'."
  scribe-expand:
    replaced_by: scribe-notes
    equivalent_master: null
    equivalent_variant: null
    migration_hint: "Command '/scribe-expand' has been unified into '/scribe-notes'. Use '/scribe-notes expand <topic>'."
