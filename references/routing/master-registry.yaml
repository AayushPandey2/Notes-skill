registry_version: 1

masters:
  M1:
    id: deep_notes
    route: deep-notes
    legacy_routes:
      - deepstudy-master
    name: Deep Learning Notes
    path: references/templates/masters/deep-notes.md
    primary_intent: comprehensive_learning
    output_goal: Comprehensive first-principles learning and deep conceptual, mathematical, or technical mastery.
    default_modules:
      - prerequisites
      - progressive_explanation
      - worked_examples
      - representation_alignment
      - misconception_prevention
      - revision_summary

  M2:
    id: study_notes
    route: study-notes
    legacy_routes:
      - studynotes
    name: Structured Study Notes
    path: references/templates/masters/study-notes.md
    primary_intent: structured_study
    output_goal: Systematic, source-aligned or syllabus-aligned study notes preserving scope and teaching sequence.
    default_modules:
      - progressive_explanation
      - worked_examples
      - revision_summary

  M3:
    id: quick_reference
    route: quick-reference
    legacy_routes:
      - cheat-sheet
      - api-table
      - atomic
    name: Quick Reference and Cheat Sheet
    path: references/templates/masters/quick-reference.md
    primary_intent: rapid_reference
    output_goal: High-density, fast-retrieval reference preserving essential syntax, symbols, and applicability conditions.
    default_modules:
      - representation_alignment
      - revision_summary

  M4:
    id: worked_solutions
    route: worked-solutions
    legacy_routes: []
    name: Worked Problems and Solutions
    path: references/templates/masters/worked-solutions.md
    primary_intent: worked_problem_solving
    output_goal: Problem-centered step-by-step worked solutions showing method selection, intermediate calculations, and verification.
    default_modules:
      - worked_examples
      - mathematical_derivation
      - misconception_prevention

  M5:
    id: implementation_guide
    route: implementation-guide
    legacy_routes:
      - dsa
    name: Implementation and Technical Guide
    path: references/templates/masters/implementation-guide.md
    primary_intent: practical_implementation
    output_goal: Build, implement, trace, test, and debug technical solutions with verified executable evidence.
    default_modules:
      - code_explanation
      - executable_verification
      - worked_examples
      - misconception_prevention

  M6:
    id: assessment
    route: assessment
    legacy_routes:
      - practice
    name: Practice and Assessment
    path: references/templates/masters/assessment.md
    primary_intent: knowledge_assessment
    output_goal: Active recall, progressive problem sets, flashcards, mock exams, and diagnostic self-testing.
    default_modules:
      - active_recall
      - misconception_prevention

  M7:
    id: synthesis_revision
    route: synthesis-revision
    legacy_routes:
      - comparison
      - summary
      - paper-breakdown
    name: Synthesis and Revision
    path: references/templates/masters/synthesis-revision.md
    primary_intent: synthesis_and_revision
    output_goal: Consolidate, compare, map relationships, deconstruct sources, and prepare efficient exam revision packs.
    default_modules:
      - comparisons
      - cross_topic_connections
      - revision_summary

variants:
  lecture_order:
    parent_master: M2
    path: references/templates/variants/lecture-order.md
    description: Preserves sequential lecture, chapter, transcript, or source order with inline examples and local bridges.
  formula_sheet:
    parent_master: M3
    path: references/templates/variants/formula-sheet.md
    description: Compact mathematical equations with symbol definitions, units, and applicability conditions.
  syntax_reference:
    parent_master: M3
    legacy_route: api-table
    path: references/templates/variants/syntax-reference.md
    description: Workflow-grouped API signatures, parameters, copy-vs-view semantics, and runnable cookbook recipes.
  command_reference:
    parent_master: M3
    path: references/templates/variants/command-reference.md
    description: CLI commands, flags, typical workflows, and operational warnings.
  atomic_card:
    parent_master: M3
    legacy_route: atomic
    path: references/templates/variants/atomic-card.md
    description: Single-concept transcludable card under 150 words for Obsidian embedding.
  flashcards:
    parent_master: M6
    path: references/templates/variants/flashcards.md
    description: High-yield active-recall front/back cards with misconception checks.
  mock_exam:
    parent_master: M6
    path: references/templates/variants/mock-exam.md
    description: Progressive mock exam and viva preparation with hidden solutions and grading rubrics.
  comparison_guide:
    parent_master: M7
    legacy_route: comparison
    path: references/templates/variants/comparison-guide.md
    description: Decision-first multi-axis trade-off matrix, causal divergence, and crossover edge case.
  paper_breakdown:
    parent_master: M7
    legacy_route: paper-breakdown
    path: references/templates/variants/paper-breakdown.md
    description: Primary research paper deconstruction, equations, empirical ablation audit, and lineage.
  quick_summary:
    parent_master: M7
    legacy_route: summary
    path: references/templates/variants/quick-summary.md
    description: Verified article, documentation, or timestamped video deconstruction and fact-check audit.
  revision_pack:
    parent_master: M7
    path: references/templates/variants/revision-pack.md
    description: Multi-note exam revision guide consolidating definitions, formulas, distinctions, and links.
  concept_map:
    parent_master: M7
    path: references/templates/variants/concept-map.md
    description: Visual Mermaid relationship map and semantic connection matrix across concepts.

subtemplates:
  mathematical:
    path: references/templates/subtemplates/mathematical.md
    registry_types: [mathematical]
    compatible_masters: [M1, M2, M3, M4, M5, M6, M7]
    required_modules: [definitions, mathematical_derivation, representation_alignment]
  computational:
    path: references/templates/subtemplates/computational.md
    registry_types: [programming, algorithmic, architectural, procedural]
    compatible_masters: [M1, M2, M3, M4, M5, M6, M7]
    required_modules: [definitions, code_explanation, executable_verification]
  scientific:
    path: references/templates/subtemplates/scientific.md
    registry_types: [scientific]
    compatible_masters: [M1, M2, M3, M4, M6, M7]
    required_modules: [definitions, representation_alignment]
  conceptual:
    path: references/templates/subtemplates/conceptual.md
    registry_types: [conceptual, comparative]
    compatible_masters: [M1, M2, M3, M6, M7]
    required_modules: [definitions, progressive_explanation]
  historical:
    path: references/templates/subtemplates/historical.md
    registry_types: [historical]
    compatible_masters: [M1, M2, M3, M6, M7]
    required_modules: [definitions]
  empirical:
    path: references/templates/subtemplates/empirical.md
    registry_types: [research]
    compatible_masters: [M1, M2, M3, M6, M7]
    required_modules: [definitions]

